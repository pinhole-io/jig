[package]
name = "jig"
version = "0.1.0"
edition = "2024"
description = "Protocol-free agent runtime for a tool loop"
license = "MIT"
repository = "https://github.com/pinhole-io/jig"
readme = "README.md"
publish = false
# Keep the MSRV at 1.88 so callers on that floor can build this crate.
rust-version = "1.88"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
jiff = "0.2"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
superglue = { path = "../superglue", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
